<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23272B"/>
      <stop offset="55%" stop-color="#181B1F"/>
      <stop offset="100%" stop-color="#0F1113"/>
    </linearGradient>
    <radialGradient id="flashGradBg" cx="60%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#FF8A00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotMap" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#4A535B" opacity="0.5"/>
    </pattern>
    <pattern id="blueprintGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 0 60" fill="none" stroke="#3A4750" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glowBg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- dot-grid world map, upper region, slow drift -->
  <g opacity="0.6">
    <rect x="-40" y="0" width="1680" height="360" fill="url(#dotMap)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -26 0; 0 0" dur="24s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- occasional soft lightning flash wash -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#flashGradBg)">
    <animate attributeName="opacity" values="0;0;0.9;0.1;0;0" keyTimes="0;0.42;0.46;0.5;0.56;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- blueprint grid floor, bottom, gentle parallax -->
  <g>
    <rect x="-60" y="620" width="1720" height="280" fill="url(#blueprintGrid)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 0; 0 0" dur="18s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- distant faint skyline -->
  <g fill="#2B3238" opacity="0.55">
    <rect x="60" y="520" width="50" height="140"/>
    <rect x="130" y="480" width="40" height="180"/>
    <rect x="1420" y="500" width="46" height="160"/>
    <rect x="1490" y="540" width="60" height="120"/>
  </g>

  <!-- main skyline cluster (echoes the mark), center-left -->
  <g filter="url(#glowBg)">
    <rect x="560" y="560" width="34" height="120" fill="#6B7785" opacity="0.7"/>
    <rect x="600" y="500" width="40" height="180" fill="#8B96A3"/>
    <rect x="646" y="550" width="48" height="130" fill="#2B3238"/>
    <path d="M550 680 L620 645 L700 680 L680 680 L620 655 L570 680 Z" fill="#2B3238"/>
  </g>

  <!-- secondary skyline cluster, right -->
  <g filter="url(#glowBg)" opacity="0.9">
    <rect x="1020" y="580" width="30" height="100" fill="#6B7785" opacity="0.7"/>
    <rect x="1054" y="530" width="36" height="150" fill="#8B96A3"/>
    <rect x="1094" y="570" width="42" height="110" fill="#2B3238"/>
  </g>

  <!-- construction crane placing a block onto the building -->
  <g stroke="#FFB347" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <line x1="900" y1="720" x2="900" y2="360"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 900 370; 4 900 370; 0 900 370; -3 900 370; 0 900 370" dur="14s" repeatCount="indefinite"/>
      <line x1="900" y1="370" x2="720" y2="370"/>
      <line x1="900" y1="370" x2="970" y2="395"/>
      <g transform="translate(720,370)">
        <line x1="0" y1="0" x2="0" y2="40" stroke="#6B7785" stroke-width="2">
          <animate attributeName="y2" values="40;170;40;40;170;40" keyTimes="0;0.42;0.46;0.5;0.56;1" dur="9s" repeatCount="indefinite"/>
        </line>
        <g transform="translate(0,40)">
          <animateTransform attributeName="transform" type="translate" values="0 40;0 170;0 40;0 40;0 170;0 40" keyTimes="0;0.42;0.46;0.5;0.56;1" dur="9s" repeatCount="indefinite"/>
          <g filter="url(#glowBg)">
            <rect x="-24" y="-18" width="48" height="36" rx="5" fill="#8B96A3" stroke="#FFE3B0" stroke-width="1.5"/>
          </g>
          <g stroke="#FF8A00" stroke-width="2.5" stroke-linecap="round">
            <line x1="-30" y1="18" x2="-50" y2="34">
              <animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.42;0.46;0.5;0.56;1" dur="9s" repeatCount="indefinite"/>
            </line>
            <line x1="0" y1="24" x2="0" y2="46">
              <animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.42;0.46;0.5;0.56;1" dur="9s" repeatCount="indefinite"/>
            </line>
            <line x1="30" y1="18" x2="50" y2="34">
              <animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.42;0.46;0.5;0.56;1" dur="9s" repeatCount="indefinite"/>
            </line>
          </g>
        </g>
      </g>
    </g>
    <line x1="900" y1="720" x2="940" y2="740"/>
    <line x1="900" y1="720" x2="860" y2="740"/>
  </g>

  <!-- circuit lines + nodes scattered lower right -->
  <g stroke="#FF8A00" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M1180 760 L1230 760 L1250 780 L1310 780" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="80;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1180 800 L1220 800 L1240 820 L1300 820" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;80" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="1310" cy="780" r="5" fill="#FFB347"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1300" cy="820" r="5" fill="#FFB347"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1180" cy="760" r="4" fill="#FFB347"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>

</svg>
